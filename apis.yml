aid: reflexer
name: Reflexer
description: 'Reflexer Labs builds RAI, a decentralized, non-pegged stable asset backed
  by ETH on Ethereum. Rather than tracking the US dollar, RAI uses an on-chain PID
  controller and algorithmic redemption rate to achieve relative price stability. The
  protocol is built on GEB, Reflexer''s open-source framework of smart contracts for
  SAFEs (collateralized debt positions), liquidations, auctions, oracles, and governance
  minimization. Developers integrate via the geb.js (JavaScript/TypeScript) and pyflex
  (Python) SDKs and query protocol state through a hosted GraphQL subgraph (The Graph
  Protocol). Sector: crypto / DeFi stablecoins.'
